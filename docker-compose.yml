services:
  postgres:
    image: postgres:15
    container_name: ilhafit_db
    restart: always
    environment:
      POSTGRES_DB: ilhafit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - ilhafit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilhafit-network

  backend:
    build:
      context: ../IlhaFit-Backend
      dockerfile: Dockerfile
    container_name: ilhafit_backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ilhafit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_USERNAME: ${MAIL_USER:-ilhaffit@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      APP_MAIL_FROM: ${MAIL_FROM:-ilhaffit@gmail.com}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:*,http://127.0.0.1:*"
      APP_FRONTEND_RESET_PASSWORD_URL: "http://localhost:3000/esqueci-senha"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ilhaFitJwtSecretKeyForDevelopmentOnlyChangeInProduction123456}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ilhafit-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilhafit_frontend
    restart: on-failure
    ports:
      - "3000:80"
    environment:
      API_UPSTREAM_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - ilhafit-network

volumes:
  ilhafit_data:

networks:
  ilhafit-network:
    driver: bridge